workflows:
  ios-testflight:
    name: BLC iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.pages.blccalendar
      vars:
        APP_STORE_APPLE_ID: "6790968637"
        XCODE_SCHEME: "App"
      node: 24
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Apply App Store signing profile
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - ios/App/build/ios/ipa/App.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
